<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Auto-Agent | Premium Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #58CC02;
            --primary-dark: #46a302;
            --bg: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 20% 20%, #1a3a0a 0%, transparent 40%),
                              radial-gradient(circle at 80% 80%, #0a1a2a 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 900px;
            height: 600px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: grid;
            grid-template-columns: 300px 1fr;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            border-right: 1px solid var(--glass-border);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item.active {
            background: var(--glass);
            color: var(--text);
            border: 1px solid var(--glass-border);
        }

        .nav-item:hover {
            background: var(--glass);
            color: var(--text);
        }

        /* Main Content */
        .main {
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-dim);
        }

        .config-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 10px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(88, 204, 2, 0.2);
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-size: 16px;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(88, 204, 2, 0.4);
        }

        .console {
            background: #000;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            height: 200px;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            color: #58CC02;
        }

        .console-line {
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(88, 204, 2, 0.1);
            color: var(--primary);
            margin-bottom: 15px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            animation: fadeIn 0.8s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                DuoAgent
            </div>
            <nav>
                <div class="nav-item active">Dashboard</div>
                <div class="nav-item">Lessons</div>
                <div class="nav-item">Settings</div>
                <div class="nav-item">Analytics</div>
            </nav>
        </aside>
        <main class="main">
            <header>
                <div class="status-badge">System Ready</div>
                <h1>Welcome back</h1>
                <p>Ready to complete your daily streak?</p>
            </header>

            <div class="config-card">
                <div class="input-group">
                    <label>Gemini API Key</label>
                    <input type="password" id="api_key" placeholder="Enter your API key...">
                </div>
                <div class="input-group">
                    <label>Custom Browser Path (Optional)</label>
                    <input type="text" id="browser_path" placeholder="C:\Path\To\comet.exe">
                </div>
                <button class="btn-primary" id="start_btn">Start Automation</button>
            </div>

            <div class="console" id="console">
                <div class="console-line">[System] DuoAgent initialized.</div>
                <div class="console-line">[System] Waiting for user to start...</div>
            </div>
        </main>
    </div>

    <script>
        const consoleEl = document.getElementById('console');
        const startBtn = document.getElementById('start_btn');
        const apiKeyInput = document.getElementById('api_key');
        const browserPathInput = document.getElementById('browser_path');

        function log(msg) {
            const line = document.createElement('div');
            line.className = 'console-line';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        startBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value;
            const browserPath = browserPathInput.value;
            if (!apiKey) {
                log('Error: API Key is required!');
                return;
            }

            log('Starting automation...');
            startBtn.disabled = true;
            startBtn.textContent = 'Running...';
            startBtn.style.opacity = '0.5';

            try {
                const response = await fetch('/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: apiKey, browser_path: browserPath })
                });
                const data = await response.json();
                log(data.message);
            } catch (err) {
                log('Error: ' + err.message);
                startBtn.disabled = false;
                startBtn.textContent = 'Start Automation';
                startBtn.style.opacity = '1';
            }
        });

        // Simple polling for logs
        setInterval(async () => {
            try {
                const response = await fetch('/logs');
                const data = await response.json();
                if (data.logs && data.logs.length > 0) {
                    data.logs.forEach(msg => log(msg));
                }
            } catch (err) {}
        }, 2000);
    </script>
</body>
</html>
